server {
    listen 80;
    server_name azh-project.space;

    return 301 https://azh-project.space$request_uri;
}


server {
    listen 443 ssl;
    server_name azh-project.space;


    ssl_certificate /root/https/azh-project.space-ssl-bundle/domain.cert.pem;
    ssl_certificate_key /root/https/azh-project.space-ssl-bundle/private.key.pem;

    # Serve frontend
    location / {
        root /var/www/among/client;
        try_files $uri /index.html;
    }

    # Proxy requests to backend
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Websocket
    location /ws/ {
        proxy_pass http://localhost:5000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    location /swagger/ {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
